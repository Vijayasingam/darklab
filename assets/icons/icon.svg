<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="48%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#1E0A4A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="1"/>
    </radialGradient>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.6"/>
    </filter>
    <filter id="lineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <line x1="336" y1="270" x2="336" y2="754"
        stroke="#3B1F7A" stroke-width="38" stroke-linecap="round"
        filter="url(#lineShadow)"/>

  <path d="M 336 270 C 336 450, 688 350, 688 512"
        fill="none" stroke="url(#lineGrad)" stroke-width="38"
        stroke-linecap="round" filter="url(#lineShadow)"/>

  <path d="M 336 754 C 336 574, 688 674, 688 512"
        fill="none" stroke="url(#lineGrad)" stroke-width="38"
        stroke-linecap="round" filter="url(#lineShadow)"/>

  <circle cx="336" cy="270" r="72" fill="url(#nodeGrad)" filter="url(#nodeShadow)"/>
  <circle cx="320" cy="254" r="26" fill="white" opacity="0.18"/>

  <circle cx="336" cy="754" r="72" fill="url(#nodeGrad)" filter="url(#nodeShadow)"/>
  <circle cx="320" cy="738" r="26" fill="white" opacity="0.18"/>

  <circle cx="688" cy="512" r="72" fill="url(#nodeGrad)" filter="url(#nodeShadow)"/>
  <circle cx="672" cy="496" r="26" fill="white" opacity="0.18"/>
</svg>
