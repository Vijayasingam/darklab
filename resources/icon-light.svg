<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: clean light grey / white -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </radialGradient>

    <!-- Path gradient: rich purple works on both dark and light backgrounds -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <!-- Node gradients: slightly deeper purple for contrast on light bg -->
    <radialGradient id="nodeTop" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <radialGradient id="nodeMid" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <radialGradient id="nodeBot" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>

    <!-- Subtle drop shadow for depth on white bg -->
    <filter id="pathShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#6d28d9" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Full-bleed background — macOS dock applies squircle mask, do NOT pre-round -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- S-curve path -->
  <path
    d="M 186,188
       C 186,238 326,215 326,256
       C 326,297 186,274 186,324"
    fill="none"
    stroke="url(#pathGrad)"
    stroke-width="20"
    stroke-linecap="round"
    filter="url(#pathShadow)"
  />

  <!-- Node A — top left -->
  <circle cx="186" cy="188" r="30" fill="url(#nodeTop)" filter="url(#nodeShadow)"/>
  <circle cx="178" cy="180" r="9" fill="white" opacity="0.38"/>

  <!-- Node B — middle right -->
  <circle cx="326" cy="256" r="24" fill="url(#nodeMid)" filter="url(#nodeShadow)"/>
  <circle cx="319" cy="249" r="7" fill="white" opacity="0.38"/>

  <!-- Node C — bottom left -->
  <circle cx="186" cy="324" r="30" fill="url(#nodeBot)" filter="url(#nodeShadow)"/>
  <circle cx="178" cy="316" r="9" fill="white" opacity="0.38"/>
</svg>
