<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision">
  <defs>
    <!-- Deep cosmic background -->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b1136"/>
      <stop offset="100%" stop-color="#070510"/>
    </radialGradient>

    <!-- Animated-feel colour blobs -->
    <radialGradient id="blobFuchsia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Monogram gradient: hot magenta through violet into electric cyan -->
    <linearGradient id="monoGrad" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Soft neon glow behind the monogram -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
</defs>

<!-- Full-bleed background — macOS applies the squircle mask to bundled icons, do NOT pre-round -->
<rect width="512" height="512" fill="url(#bg)"/>

  <!-- Colour blobs drifting behind the mark -->
  <circle cx="132" cy="118" r="150" fill="url(#blobFuchsia)" opacity="0.55" filter="url(#blurBig)"/>
  <circle cx="404" cy="150" r="120" fill="url(#blobCyan)" opacity="0.45" filter="url(#blurBig)"/>
  <circle cx="312" cy="432" r="160" fill="url(#blobViolet)" opacity="0.55" filter="url(#blurBig)"/>

  <!-- Glow halo under the monogram -->
  <path d="M148,140 H268 A116,116 0 0 1 268,372 H148 Z M210,196 H252 A60,60 0 0 1 252,316 H210 Z"
        fill="url(#monoGrad)" fill-rule="evenodd" opacity="0.55" filter="url(#softGlow)"/>

  <!-- Bold geometric D monogram -->
  <path d="M148,140 H268 A116,116 0 0 1 268,372 H148 Z M210,196 H252 A60,60 0 0 1 252,316 H210 Z"
        fill="url(#monoGrad)" fill-rule="evenodd"/>

  <!-- Four-point sparkle top-right -->
  <path d="M 408,108 L 416,128 L 436,136 L 416,144 L 408,164 L 400,144 L 380,136 L 400,128 Z"
        fill="#ffffff" opacity="0.92"/>
</svg>
