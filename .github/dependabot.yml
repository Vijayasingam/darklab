version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Major bumps get individual PRs so breaking changes are reviewed separately
      major:
        update-types:
          - major
      # All minor + patch updates batched into one PR per week
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-major:
        update-types:
          - major
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
